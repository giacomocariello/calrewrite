[package]
name = "calrewrite"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
chrono = "0.4"
